name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate missing Android files
        run: |
          flutter create --platforms=android --project-name photo_notes --org com.example /tmp/scaffold
          cp -rn /tmp/scaffold/android .

      - run: flutter pub get
      - run: flutter build apk --release --dart-define=APPWRITE_API_KEY=${{ secrets.APPWRITE_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
